[package]
name = "syn2b"
version = "0.1.0"
edition = "2021"
authors = ["Syn2b Contributors"]
description = "Syn2b — 2bRAD-based Synteny Detection Engine"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1"
parking_lot = "0.12"
rayon = "1.8"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "syn2b"
path = "src/main.rs"

[lib]
name = "bsyn"
path = "src/lib.rs"
